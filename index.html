<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ══ PALETTES ══════════════════════════════════════════ */
const PALETTES=[
  {C:[0,55,95],Cs:[285,85,45],D:[55,90,60],Ds:[25,70,65],E:[200,80,70],F:[350,90,35],Fs:[220,75,75],G:[30,85,65],Gs:[275,70,50],A:[120,85,55],As:[320,85,40],B:[210,85,80]},
  {C:[5,35,80],Cs:[290,30,85],D:[60,40,85],Ds:[35,35,80],E:[205,35,85],F:[355,40,75],Fs:[225,35,85],G:[35,40,85],Gs:[280,35,80],A:[125,40,80],As:[325,35,75],B:[215,40,88]},
  {C:[15,75,65],Cs:[300,70,60],D:[70,75,70],Ds:[45,65,70],E:[215,70,75],F:[10,75,50],Fs:[235,70,80],G:[45,75,70],Gs:[290,65,65],A:[135,75,65],As:[340,70,55],B:[225,75,85]},
  {C:[0,100,60],Cs:[285,100,55],D:[55,100,70],Ds:[25,100,75],E:[200,100,80],F:[350,100,45],Fs:[220,100,85],G:[30,100,75],Gs:[275,100,60],A:[120,100,65],As:[320,100,50],B:[210,100,90]},
  {C:[260,70,50],Cs:[275,75,45],D:[285,65,55],Ds:[295,70,60],E:[305,65,65],F:[315,75,40],Fs:[325,70,70],G:[270,75,60],Gs:[280,65,50],A:[290,70,55],As:[300,75,45],B:[250,80,80]}
];
const NOTE_NAMES=['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];
const NOTE_MIN=37,NOTE_MAX=97;
function hsl2rgb(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)];}

/* ══ THREE.JS ══════════════════════════════════════════ */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0.04,0.04,0.10);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
camera.position.set(0,0,14);

const pivot=new THREE.Group();
scene.add(pivot);

scene.add(new THREE.AmbientLight(0xffffff,0.3));
const dL=new THREE.DirectionalLight(0xffffff,0.9);
dL.position.set(6,10,12);scene.add(dL);
const rL=new THREE.DirectionalLight(0x6688ff,0.3);
rL.position.set(-8,-4,-10);scene.add(rL);

/* ══ SHADERS ═══════════════════════════════════════════ */
const VERT=`
uniform float u_time;
uniform float u_seed;
uniform float u_rough;
varying vec3 vN;
varying vec3 vWP;

float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noise(vec3 p){
  vec3 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(
    mix(mix(hash(i),hash(i+vec3(1,0,0)),u.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),u.x),u.y),
    mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),u.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),u.x),u.y),u.z);
}
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.+vec3(1.7,9.2,3.5);a*=.5;}return v;}

void main(){
  // Déformation FBM + variation le long du tube (u_seed varie par segment)
  float disp=fbm(normal*3.+u_seed+position*.5)*u_rough*.35;
  vec3 p=position+normal*disp;
  vN=normalize(normalMatrix*normal);
  vWP=(modelMatrix*vec4(p,1.)).xyz;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
}`;

const FRAG=`
uniform float u_time;
uniform vec3  u_color;
uniform float u_irid;
uniform float u_alpha;
varying vec3 vN;
varying vec3 vWP;

void main(){
  vec3 n=normalize(vN);
  vec3 ld=normalize(vec3(.6,.8,1.));
  vec3 vd=normalize(cameraPosition-vWP);
  vec3 hv=normalize(ld+vd);
  float diff=max(0.,dot(n,ld))*.65+.35;
  float spec=pow(max(0.,dot(n,hv)),28.)*.6;
  float fr=pow(1.-max(0.,dot(n,vd)),2.2);
  vec3 ird=.5+.5*cos(vec3(0,2.094,4.188)+dot(n,ld)*5.-u_time*.4);
  vec3 col=u_color*diff+vec3(spec)+ird*u_irid*fr*1.5+u_color*fr*.3;
  gl_FragColor=vec4(clamp(col,0.,1.),u_alpha);
}`;

/* ══ GRILLE ════════════════════════════════════════════ */
const gridGroup=new THREE.Group();
pivot.add(gridGroup);
let showGrid=true;
(()=>{
  const sz=5,N=8;
  const mF=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.09,depthWrite:false});
  const mB=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.20,depthWrite:false});
  for(let i=0;i<=N;i++){
    const t=(i/N)*2*sz-sz;
    [[-sz,t,-sz,sz,t,-sz],[-sz,t,sz,sz,t,sz],
     [t,-sz,-sz,t,sz,-sz],[t,-sz,sz,t,sz,sz],
     [-sz,-sz,t,sz,-sz,t],[-sz,sz,t,sz,sz,t]
    ].forEach(([x1,y1,z1,x2,y2,z2])=>{
      const g=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1,y1,z1),new THREE.Vector3(x2,y2,z2)
      ]);
      gridGroup.add(new THREE.Line(g,mF));
    });
  }
  [[-sz,-sz],[-sz,sz],[sz,-sz],[sz,sz]].forEach(([x,y])=>{
    const g=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x,y,-sz),new THREE.Vector3(x,y,sz)
    ]);
    gridGroup.add(new THREE.Line(g,mB));
  });
})();

/* ══ TUBE BUILDER ══════════════════════════════════════
   Tube 3D dynamique avec shader FBM.
   Le rayon varie le long du tube : épais au début (tête),
   effilé vers la fin (queue de comète).
══════════════════════════════════════════════════════ */
const TUBE_SIDES=12;
const MAX_PTS=600; // points max par tube

function makeTube(r,g,b,baseRadius){
  const seed=Math.random()*999;
  const mat=new THREE.ShaderMaterial({
    vertexShader:VERT,fragmentShader:FRAG,
    uniforms:{
      u_time:{value:0},
      u_seed:{value:seed},
      u_rough:{value:roughness},
      u_color:{value:new THREE.Color(r,g,b)},
      u_irid:{value:iridescence},
      u_alpha:{value:1.0}
    }
  });

  // Buffer pré-alloué : MAX_PTS anneaux × TUBE_SIDES × 2 triangles × 3 vertices
  const maxVerts=MAX_PTS*TUBE_SIDES*6;
  const posArr=new Float32Array(maxVerts*3);
  const norArr=new Float32Array(maxVerts*3);
  const posAttr=new THREE.BufferAttribute(posArr,3);
  const norAttr=new THREE.BufferAttribute(norArr,3);
  posAttr.usage=THREE.DynamicDrawUsage;
  norAttr.usage=THREE.DynamicDrawUsage;

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',posAttr);
  geo.setAttribute('normal',norAttr);
  geo.setDrawRange(0,0);

  const mesh=new THREE.Mesh(geo,mat);
  mesh.frustumCulled=false;
  pivot.add(mesh);

  let vCount=0;
  let prevRing=null;
  let prevPos=null;
  let prevRight=new THREE.Vector3(1,0,0);
  let pointCount=0;
  const allRings=[]; // pour le fade (rayon décroissant vers la queue)

  function ring(center,fwd,radius){
    const up=new THREE.Vector3(0,1,0);
    let right=new THREE.Vector3().crossVectors(fwd,up).normalize();
    if(right.lengthSq()<0.0001) right.copy(prevRight);
    prevRight.copy(right);
    const realUp=new THREE.Vector3().crossVectors(right,fwd).normalize();
    const pts=[];
    for(let i=0;i<TUBE_SIDES;i++){
      const a=(i/TUBE_SIDES)*Math.PI*2;
      const nx=Math.cos(a),ny=Math.sin(a);
      // Légère perturbation radiale (organique)
      const jitter=1+0.18*Math.sin(a*3+seed+pointCount*0.15);
      const r2=radius*jitter;
      const n=new THREE.Vector3().addScaledVector(right,nx).addScaledVector(realUp,ny).normalize();
      const p=new THREE.Vector3().copy(center).addScaledVector(right,nx*r2).addScaledVector(realUp,ny*r2);
      pts.push({p,n});
    }
    return pts;
  }

  function writeRing(ringA,ringB){
    for(let i=0;i<TUBE_SIDES;i++){
      const ni=(i+1)%TUBE_SIDES;
      const tris=[
        [ringB[i].p,ringB[ni].p,ringA[i].p,  ringB[i].n,ringB[ni].n,ringA[i].n],
        [ringB[ni].p,ringA[ni].p,ringA[i].p, ringB[ni].n,ringA[ni].n,ringA[i].n]
      ];
      for(const[p1,p2,p3,n1,n2,n3] of tris){
        if(vCount+3>=maxVerts) return;
        p1.toArray(posArr,vCount*3);n1.toArray(norArr,vCount*3);vCount++;
        p2.toArray(posArr,vCount*3);n2.toArray(norArr,vCount*3);vCount++;
        p3.toArray(posArr,vCount*3);n3.toArray(norArr,vCount*3);vCount++;
      }
    }
    geo.setDrawRange(0,vCount);
    posAttr.needsUpdate=true;
    norAttr.needsUpdate=true;
  }

  function addPoint(pos,radiusScale){
    if(!prevPos){
      prevPos=pos.clone();
      const fwd=new THREE.Vector3(0,1,0);
      prevRing=ring(pos,fwd,baseRadius*radiusScale);
      allRings.push({ring:prevRing,r:baseRadius*radiusScale});
      pointCount++;
      return;
    }
    if(pos.distanceTo(prevPos)<0.015) return; // plus petit = plus fluide
    const fwd=new THREE.Vector3().subVectors(pos,prevPos).normalize();
    const newRing=ring(pos,fwd,baseRadius*radiusScale);
    writeRing(prevRing,newRing);
    prevRing=newRing;
    prevPos=pos.clone();
    allRings.push({ring:newRing,r:baseRadius*radiusScale});
    pointCount++;
  }

  function setTime(t){mat.uniforms.u_time.value=t;}
  function setRough(v){mat.uniforms.u_rough.value=v;}
  function setIrid(v){mat.uniforms.u_irid.value=v;}

  function dispose(){
    pivot.remove(mesh);
    geo.dispose();mat.dispose();
  }

  return{addPoint,setTime,setRough,setIrid,dispose,mesh,mat};
}

/* ══ PARAMS ════════════════════════════════════════════ */
let palIdx=0;
let roughness=0.55,iridescence=0.60,spdMult=0.30,trailLife=20;
let tubeThickness=0.12;
let rotMode='auto',rotSpd=15;
let pedalDown=false,firstNote=false,timeX=0;

/* ══ DIRECTION V2 EN 3D ════════════════════════════════ */
function noteToPos3D(note,vel){
  const y=((note-NOTE_MIN)/(NOTE_MAX-NOTE_MIN))*7-3.5;
  const velN=(vel-1)/126;
  const z=(velN-.5)*5;
  const x=Math.sin(timeX*0.08)*3.8;
  return new THREE.Vector3(x,y,z);
}

function velToDir3D(vel,isEven){
  const VL=50,VH=110,VT=70,CO=35;
  let dx,dy;
  if(vel>=VH)      {dx=0;dy=1;}
  else if(vel<=VL) {dx=0;dy=-1;}
  else if(vel>=VT) {dx=isEven?.7:-.7;dy=.7;}
  else             {dx=isEven?.7:-.7;dy=-.7;}
  const len=Math.sqrt(dx*dx+dy*dy);
  dx/=len;dy/=len;

  // Vitesse quadratique V2
  const velN=(vel-1)/126;
  const spd=(0.002+velN*velN*0.08)*spdMult;

  // Courbure V2
  let omega=0;
  if(vel>CO&&vel>VL&&vel<VH){
    const k=(vel-CO)/(127-CO);
    const od=1.2+(1.0-1.2)*Math.max(0,Math.min(1,k));
    omega=od*(vel>=VT?1:-1)*Math.PI/180*0.5;
  }
  return{vx:dx*spd,vy:dy*spd,vz:0.008*spd,omega,angle:0};
}

/* ══ NOTES ACTIVES ═════════════════════════════════════ */
const activeNotes=new Map();
const deadTubes=[];  // tubes figés qui s'effacent

/* ══ TRAJECTOIRES — ligne qui relie les points de départ ══ */
const trajPoints=[];   // [{pos, color}]
const MAX_TRAJ=200;
let trajLine=null;
let trajGeo=null;
let trajPosAttr=null;

function initTrajLine(){
  trajGeo=new THREE.BufferGeometry();
  const arr=new Float32Array(MAX_TRAJ*3);
  trajPosAttr=new THREE.BufferAttribute(arr,3);
  trajPosAttr.usage=THREE.DynamicDrawUsage;
  trajGeo.setAttribute('position',trajPosAttr);
  trajGeo.setDrawRange(0,0);
  const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.7,depthWrite:false});
  // Couleurs
  const colArr=new Float32Array(MAX_TRAJ*3);
  const colAttr=new THREE.BufferAttribute(colArr,3);
  colAttr.usage=THREE.DynamicDrawUsage;
  trajGeo.setAttribute('color',colAttr);
  trajLine=new THREE.Line(trajGeo,mat);
  trajLine.frustumCulled=false;
  pivot.add(trajLine);
}
initTrajLine();

function addTrajPoint(pos,rgb){
  if(trajPoints.length>=MAX_TRAJ) trajPoints.shift();
  trajPoints.push({pos:pos.clone(),rgb});
  // Mettre à jour la géométrie
  const arr=trajPosAttr.array;
  const colArr=trajGeo.attributes.color.array;
  trajPoints.forEach((p,i)=>{
    p.pos.toArray(arr,i*3);
    colArr[i*3]=p.rgb[0];colArr[i*3+1]=p.rgb[1];colArr[i*3+2]=p.rgb[2];
  });
  trajGeo.setDrawRange(0,trajPoints.length);
  trajPosAttr.needsUpdate=true;
  trajGeo.attributes.color.needsUpdate=true;
}

/* ══ BLOB DE TÊTE — sphère lumineuse qui précède le tube ══ */
function makeHeadBlob(r,g,b,radius){
  const geo=new THREE.SphereGeometry(radius*1.4,12,8);
  const mat=new THREE.ShaderMaterial({
    vertexShader:VERT,fragmentShader:FRAG,
    uniforms:{
      u_time:{value:0},u_seed:{value:Math.random()*999},
      u_rough:{value:0.4},
      u_color:{value:new THREE.Color(r,g,b)},
      u_irid:{value:0.8},u_alpha:{value:1.0}
    },
    transparent:true
  });
  const mesh=new THREE.Mesh(geo,mat);
  pivot.add(mesh);
  return{mesh,mat,dispose(){pivot.remove(mesh);geo.dispose();mat.dispose();}};
}

function spawnNote(note,vel){
  if(activeNotes.has(note)) releaseNote(note);

  const pal=PALETTES[palIdx];
  const name=NOTE_NAMES[note%12];
  const hsl=pal[name]||[0,80,60];
  const rgb=hsl2rgb(hsl[0],hsl[1],Math.min(93,hsl[2]+Math.floor(note/12)*3));
  const velN=(vel-1)/126;

  const pos=noteToPos3D(note,vel);
  timeX+=0.7+(vel/127)*1.3;

  const radius=tubeThickness*(0.4+velN*0.8);
  const tube=makeTube(rgb[0],rgb[1],rgb[2],radius);
  const head=makeHeadBlob(rgb[0],rgb[1],rgb[2],radius);
  tube.addPoint(pos.clone(),1.0);
  head.mesh.position.copy(pos);

  addTrajPoint(pos,rgb);

  const{vx,vy,vz,omega}=velToDir3D(vel,note%2===0);

  activeNotes.set(note,{
    tube,head,pos,
    vx,vy,vz,
    omega,angle:0,
    vx0:vx,vy0:vy,
    velN,alive:true,rgb
  });

  if(!firstNote){firstNote=true;document.getElementById('hint').classList.add('gone');}
  logNote(note,vel,rgb);
}

function releaseNote(note){
  const b=activeNotes.get(note);
  if(!b) return;
  b.alive=false;
  // Fade le blob de tête
  b.head.dispose();
  // Tube reste visible et s'efface progressivement
  deadTubes.push({tube:b.tube,age:0,maxAge:trailLife});
  activeNotes.delete(note);
}

function onPedalChange(down){
  const was=pedalDown;pedalDown=down;
  document.getElementById('ped-ind').classList.toggle('on',down);
  if(!down&&was){
    if(rotMode==='pedal') pivot.rotation.y+=Math.PI/4;
    [...activeNotes.keys()].forEach(n=>releaseNote(n));
  }
}

function clearAll(){
  for(const[,b] of activeNotes){b.tube.dispose();b.head.dispose();}
  activeNotes.clear();
  for(const{tube} of deadTubes) tube.dispose();
  deadTubes.length=0;
  trajPoints.length=0;
  if(trajGeo) trajGeo.setDrawRange(0,0);
}

/* ══ BOUCLE ════════════════════════════════════════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta());
  const t=clock.getElapsedTime();

  // Rotation
  if(rotMode==='auto') pivot.rotation.y+=rotSpd*0.00015*dt*60;

  // Update notes actives
  for(const[note,b] of activeNotes){
    b.tube.setTime(t);
    b.tube.setRough(roughness);
    b.tube.setIrid(iridescence);

    if(!b.alive) continue;

    b.angle+=b.omega;
    const cosA=Math.cos(b.angle),sinA=Math.sin(b.angle);
    const nx=b.vx0*cosA-b.vy0*sinA;
    const ny=b.vx0*sinA+b.vy0*cosA;

    b.pos.x+=nx*dt*60;
    b.pos.y+=ny*dt*60;
    b.pos.z+=b.vz*dt*60;

    if(Math.abs(b.pos.x)>5){b.vx0=-b.vx0;}
    if(Math.abs(b.pos.y)>4){b.vy0=-b.vy0;}
    if(Math.abs(b.pos.z)>4){b.vz=-b.vz;}
    b.pos.clampScalar(-5,5);

    // Déplacer le blob de tête
    b.head.mesh.position.copy(b.pos);
    b.head.mat.uniforms.u_time.value=t;
    // Légère pulsation
    const pulse=1+Math.sin(t*3+note*0.3)*0.06;
    b.head.mesh.scale.setScalar(pulse);

    b.tube.addPoint(b.pos.clone(),1.0);
  }

  // Fade doux des tubes figés — l'alpha diminue progressivement
  for(let i=deadTubes.length-1;i>=0;i--){
    const d=deadTubes[i];
    d.age+=dt;
    const life=Math.max(0,1-d.age/d.maxAge);
    // Courbe de fade : reste opaque longtemps puis disparaît vite
    const alpha=life*life*life*0.5+life*0.5;
    d.tube.mat.uniforms.u_alpha.value=alpha;
    d.tube.setTime(t);
    if(life<=0){
      d.tube.dispose();
      deadTubes.splice(i,1);
    }
  }

  renderer.render(scene,camera);
}

/* ══ LOG ═══════════════════════════════════════════════ */
const logEl=document.getElementById('note-log');
function logNote(note,vel,rgb){
  const name=NOTE_NAMES[note%12],oct=Math.floor(note/12)-1;
  const d=document.createElement('div');d.className='nrow';
  d.innerHTML=`<div class="nbadge" style="background:rgb(${Math.round(rgb[0]*255)},${Math.round(rgb[1]*255)},${Math.round(rgb[2]*255)})"></div><span style="color:rgba(255,255,255,.72);min-width:26px">${name}${oct}</span><span style="color:rgba(255,255,255,.32)">vel ${vel}</span>`;
  logEl.prepend(d);if(logEl.children.length>6)logEl.removeChild(logEl.lastChild);
}

/* ══ MIDI ══════════════════════════════════════════════ */
const midiDot=document.getElementById('midi-dot');
const midiLbl=document.getElementById('midi-label');
function onMidi(e){
  const st=e.data[0]&0xF0,note=e.data[1],vel=e.data[2];
  if(st===0x90&&vel>0&&note>=NOTE_MIN&&note<=NOTE_MAX) spawnNote(note,vel);
  if((st===0x80||(st===0x90&&vel===0))&&note>=NOTE_MIN&&note<=NOTE_MAX) releaseNote(note);
  if(st===0xB0&&note===64) onPedalChange(vel>=64);
}
if(navigator.requestMIDIAccess){
  navigator.requestMIDIAccess({sysex:false}).then(midi=>{
    midiDot.classList.add('on');midiLbl.textContent='MIDI connecté';
    const conn=()=>{for(const i of midi.inputs.values())i.onmidimessage=onMidi;};
    conn();midi.onstatechange=conn;
  }).catch(()=>{midiDot.classList.add('err');midiLbl.textContent='Accès MIDI refusé';});
}else{midiDot.classList.add('err');midiLbl.textContent='WebMIDI non supporté';}

/* ══ CLAVIER ═══════════════════════════════════════════ */
const KEYMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,l:73};
const held=new Set();
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key===' '){e.preventDefault();onPedalChange(true);return;}
  if(e.key==='c'||e.key==='C'){clearAll();return;}
  const n=KEYMAP[e.key.toLowerCase()];
  if(n&&!held.has(e.key)){held.add(e.key);spawnNote(n,Math.floor(45+Math.random()*75));}
});
window.addEventListener('keyup',e=>{
  if(e.key===' '){onPedalChange(false);return;}
  const n=KEYMAP[e.key.toLowerCase()];
  if(n){held.delete(e.key);releaseNote(n);}
});

/* ══ CONTRÔLES ══════════════════════════════════════════ */
function bind(id,cb){document.getElementById(id).addEventListener('input',cb);}
function bindC(id,cb){document.getElementById(id).addEventListener('change',cb);}
bind('thick',e=>{
  tubeThickness=+e.target.value/100;
  document.getElementById('thick-v').textContent=e.target.value;
});
bind('rough',e=>{
  roughness=+e.target.value/100;
  document.getElementById('rough-v').textContent=e.target.value+'%';
});
bind('irid',e=>{
  iridescence=+e.target.value/100;
  document.getElementById('irid-v').textContent=e.target.value+'%';
});
bind('spd',e=>{
  spdMult=+e.target.value/100;
  document.getElementById('spd-v').textContent=e.target.value+'%';
});
bind('life',e=>{
  trailLife=+e.target.value;
  document.getElementById('life-v').textContent=e.target.value+'s';
});
bind('rotspd',e=>{
  rotSpd=+e.target.value;
  document.getElementById('rotspd-v').textContent=e.target.value;
});
bindC('pal-sel',e=>{palIdx=+e.target.value;});
bindC('bg-sel',e=>{
  const c=e.target.value.split(',').map(Number);
  scene.background=new THREE.Color(c[0],c[1],c[2]);
});
bindC('rot-sel',e=>{rotMode=e.target.value;});
bindC('grid-sel',e=>{showGrid=e.target.value==='1';gridGroup.visible=showGrid;});

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
