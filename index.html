<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ══ PALETTES ══════════════════════════════════════════ */
const PALETTES=[
  {C:[0,55,95],Cs:[285,85,45],D:[55,90,60],Ds:[25,70,65],E:[200,80,70],F:[350,90,35],Fs:[220,75,75],G:[30,85,65],Gs:[275,70,50],A:[120,85,55],As:[320,85,40],B:[210,85,80]},
  {C:[5,35,80],Cs:[290,30,85],D:[60,40,85],Ds:[35,35,80],E:[205,35,85],F:[355,40,75],Fs:[225,35,85],G:[35,40,85],Gs:[280,35,80],A:[125,40,80],As:[325,35,75],B:[215,40,88]},
  {C:[15,75,65],Cs:[300,70,60],D:[70,75,70],Ds:[45,65,70],E:[215,70,75],F:[10,75,50],Fs:[235,70,80],G:[45,75,70],Gs:[290,65,65],A:[135,75,65],As:[340,70,55],B:[225,75,85]},
  {C:[0,100,60],Cs:[285,100,55],D:[55,100,70],Ds:[25,100,75],E:[200,100,80],F:[350,100,45],Fs:[220,100,85],G:[30,100,75],Gs:[275,100,60],A:[120,100,65],As:[320,100,50],B:[210,100,90]},
  {C:[260,70,50],Cs:[275,75,45],D:[285,65,55],Ds:[295,70,60],E:[305,65,65],F:[315,75,40],Fs:[325,70,70],G:[270,75,60],Gs:[280,65,50],A:[290,70,55],As:[300,75,45],B:[250,80,80]}
];
const NOTE_NAMES=['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];
const NOTE_MIN=37,NOTE_MAX=97;
function hsl2rgb(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)];}

/* ══ THREE.JS ══════════════════════════════════════════ */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0.04,0.04,0.10);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
camera.position.set(0,0,14);
const pivot=new THREE.Group();
scene.add(pivot);
scene.add(new THREE.AmbientLight(0xffffff,0.3));
const dL=new THREE.DirectionalLight(0xffffff,0.9);
dL.position.set(6,10,12);scene.add(dL);
const rL=new THREE.DirectionalLight(0x6688ff,0.3);
rL.position.set(-8,-4,-10);
scene.add(rL);

/* ══ PARAMS ════════════════════════════════════════════ */
let palIdx=0,emitRate=70,fadeLife=15,spreadAmt=0.025,burstStr=0.55,spdMult=0.30;
let noiseAmp=0.030,noiseFreq=0.12,noiseSpd=0.10,attractStr=0.30;
let rotMode='auto',rotSpd=15,showGrid=true,showTraj=true;
let pedalDown=false,firstNote=false,timeX=0;

/* ══ GRILLE ════════════════════════════════════════════ */
const gridGroup=new THREE.Group();pivot.add(gridGroup);
(()=>{
  const sz=5,N=8;
  const mF=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.09,depthWrite:false});
  const mB=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.20,depthWrite:false});
  for(let i=0;i<=N;i++){
    const t=(i/N)*2*sz-sz;
    [[-sz,t,-sz,sz,t,-sz],[-sz,t,sz,sz,t,sz],[t,-sz,-sz,t,sz,-sz],[t,-sz,sz,t,sz,sz],[-sz,-sz,t,sz,-sz,t],[-sz,sz,t,sz,sz,t]
    ].forEach(([x1,y1,z1,x2,y2,z2])=>{
      gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y1,z1),new THREE.Vector3(x2,y2,z2)]),mF));
    });
  }
  [[-sz,-sz],[-sz,sz],[sz,-sz],[sz,sz]].forEach(([x,y])=>{
    gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,y,-sz),new THREE.Vector3(x,y,sz)]),mB));
  });
})();

/* ══ TRAJECTOIRES ══════════════════════════════════════ */
const trajPts=[];
const MAX_TRAJ=200;
let trajLine=null,trajGeo=null,trajPosAttr=null,trajColAttr=null;
(()=>{
  trajGeo=new THREE.BufferGeometry();
  const pa=new Float32Array(MAX_TRAJ*3),ca=new Float32Array(MAX_TRAJ*3);
  trajPosAttr=new THREE.BufferAttribute(pa,3);
  trajColAttr=new THREE.BufferAttribute(ca,3);
  trajPosAttr.usage=trajColAttr.usage=THREE.DynamicDrawUsage;
  trajGeo.setAttribute('position',trajPosAttr);
  trajGeo.setAttribute('color',trajColAttr);
  trajGeo.setDrawRange(0,0);
  trajLine=new THREE.Line(trajGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.6,depthWrite:false}));
  trajLine.frustumCulled=false;
  pivot.add(trajLine);
})();

function addTrajPt(pos,rgb){
  if(trajPts.length>=MAX_TRAJ)trajPts.shift();
  trajPts.push({pos:pos.clone(),rgb});
  trajPts.forEach((p,i)=>{
    p.pos.toArray(trajPosAttr.array,i*3);
    trajColAttr.array[i*3]=p.rgb[0];trajColAttr.array[i*3+1]=p.rgb[1];trajColAttr.array[i*3+2]=p.rgb[2];
  });
  trajGeo.setDrawRange(0,trajPts.length);
  trajPosAttr.needsUpdate=trajColAttr.needsUpdate=true;
}

/* ══ CURL NOISE 3D ═════════════════════════════════════ */
function hash3(x,y,z){const n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n);}
function noiseVal(x,y,z){
  const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);
  const fx=x-ix,fy=y-iy,fz=z-iz;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),uz=fz*fz*(3-2*fz);
  return(hash3(ix,iy,iz)*(1-ux)+hash3(ix+1,iy,iz)*ux)*(1-uy)*(1-uz)
        +(hash3(ix,iy+1,iz)*(1-ux)+hash3(ix+1,iy+1,iz)*ux)*uy*(1-uz)
        +(hash3(ix,iy,iz+1)*(1-ux)+hash3(ix+1,iy,iz+1)*ux)*(1-uy)*uz
        +(hash3(ix,iy+1,iz+1)*(1-ux)+hash3(ix+1,iy+1,iz+1)*ux)*uy*uz;
}
function curlNoise(x,y,z,t){
  const e=0.01,f=noiseFreq,ft=noiseSpd;
  const dzdx=(noiseVal(x+e,y,z+ft*t)-noiseVal(x-e,y,z+ft*t))/(2*e);
  const dzdy=(noiseVal(x,y+e,z+ft*t)-noiseVal(x,y-e,z+ft*t))/(2*e);
  const dydz=(noiseVal(x,y,z+e+ft*t)-noiseVal(x,y,z-e+ft*t))/(2*e);
  const dxdz=(noiseVal(x+e,y,z+ft*t)-noiseVal(x-e,y,z+ft*t))/(2*e);
  const dxdy=(noiseVal(x,y+e,z+ft*t)-noiseVal(x,y-e,z+ft*t))/(2*e);
  const dydx=(noiseVal(x+e,y,z+ft*t)-noiseVal(x-e,y,z+ft*t))/(2*e);
  return{x:(dzdy-dydz)*noiseAmp,y:(dxdz-dzdx)*noiseAmp,z:(dydx-dxdy)*noiseAmp};
}

/* ══ SHADER PARTICULES ═════════════════════════════════ */
const VERT_P=`
attribute float a_life;
attribute float a_size;
attribute vec3  a_color;
uniform   float u_time;
varying   float v_life;
varying   vec3  v_color;
void main(){
  v_life=a_life;v_color=a_color;
  vec4 mv=modelViewMatrix*vec4(position,1.0);
  float sz=a_size*(0.3+a_life*0.7)*580.0;
  gl_PointSize=max(1.0,sz/-mv.z);
  gl_Position=projectionMatrix*mv;
}`;
const FRAG_P=`
varying float v_life;
varying vec3  v_color;
uniform float u_time;
void main(){
  vec2 uv=gl_PointCoord-0.5;
  float d=length(uv);
  if(d>0.5)discard;
  float alpha=smoothstep(0.5,0.0,d)*smoothstep(0.0,0.06,v_life);
  vec3 ird=0.5+0.5*cos(vec3(0,2.094,4.188)+d*5.0-u_time*0.3);
  vec3 col=v_color*(0.7+0.3*v_life)+ird*0.25*v_life;
  gl_FragColor=vec4(clamp(col,0.,1.),alpha*0.85);
}`;

const MAX_P=8000,ANCHOR_L=0.4;
const BOX={x:5,y:4,z:4};

function makeFlux(r,g,b){
  const pos=new Float32Array(MAX_P*3),col=new Float32Array(MAX_P*3);
  const lif=new Float32Array(MAX_P),siz=new Float32Array(MAX_P);
  const pvx=new Float32Array(MAX_P),pvy=new Float32Array(MAX_P),pvz=new Float32Array(MAX_P);
  const raw=new Float32Array(MAX_P),anc=new Uint8Array(MAX_P);
  for(let i=0;i<MAX_P;i++){pos[i*3+1]=10000;siz[i]=0.07+Math.random()*0.09;}

  const geo=new THREE.BufferGeometry();
  const pa=new THREE.BufferAttribute(pos,3),la=new THREE.BufferAttribute(lif,1);
  const sa=new THREE.BufferAttribute(siz,1),ca=new THREE.BufferAttribute(col,3);
  pa.usage=la.usage=sa.usage=ca.usage=THREE.DynamicDrawUsage;
  geo.setAttribute('position',pa);geo.setAttribute('a_life',la);
  geo.setAttribute('a_size',sa);
  geo.setAttribute('a_color',ca);
  const mat=new THREE.ShaderMaterial({
    vertexShader:VERT_P,fragmentShader:FRAG_P,
    uniforms:{u_time:{value:0}},
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  });
  const pts=new THREE.Points(geo,mat);
  pts.frustumCulled=false;pivot.add(pts);
  let nxt=0;

  function emit(px,py,pz,dvx,dvy,dvz,isAnc){
    const i=nxt%MAX_P;nxt++;
    pos[i*3]=px;pos[i*3+1]=py;pos[i*3+2]=pz;
    const sp=spreadAmt;
    pvx[i]=dvx+(Math.random()-.5)*sp*2;
    pvy[i]=dvy+(Math.random()-.5)*sp*2;
    pvz[i]=dvz+(Math.random()-.5)*sp*3;
    raw[i]=isAnc?ANCHOR_L:fadeLife*(0.6+Math.random()*0.4);
    lif[i]=1.0;siz[i]=0.06+Math.random()*0.10;
    anc[i]=isAnc?1:0;
    col[i*3]=r;col[i*3+1]=g;col[i*3+2]=b;
  }

  function burst(wnx,wny,wnz){
    const pts2=[];
    for(let i=0;i<MAX_P;i++){
      if(anc[i]===1&&raw[i]>0){
        pts2.push([pos[i*3],pos[i*3+1],pos[i*3+2]]);
        anc[i]=0;raw[i]=fadeLife*(0.4+Math.random()*0.6);lif[i]=1.0;
      }
    }
    const step=Math.max(1,Math.floor(pts2.length/80));
    for(let k=0;k<pts2.length;k+=step){
      const[px,py,pz]=pts2[k];
      for(let b=0;b<4;b++){
        const spd=burstStr*(0.02+Math.random()*0.05);
        const rx=(Math.random()-.5)*0.6,ry=(Math.random()-.5)*0.6,rz=(Math.random()-.5)*0.6;
        emit(px,py,pz,(wnx+rx)*spd,(wny+ry)*spd,(wnz+rz)*spd,false);
      }
    }
  }

  function releaseAll(){
    for(let i=0;i<MAX_P;i++){
      if(anc[i]===1&&raw[i]>0){anc[i]=0;raw[i]=fadeLife*(0.5+Math.random()*0.5);lif[i]=1.0;}
    }
  }

  function update(dt,t){
    let alive=false;
    for(let i=0;i<MAX_P;i++){
      if(raw[i]<=0)continue;
      alive=true;
      if(anc[i]===1){raw[i]=ANCHOR_L;lif[i]=1.0;pvx[i]*=0.85;pvy[i]*=0.85;pvz[i]*=0.85;}
      else{raw[i]-=dt;lif[i]=Math.max(0,raw[i]/fadeLife);pvx[i]*=0.97;pvy[i]*=0.97;pvz[i]*=0.97;}
      const cn=curlNoise(pos[i*3]*noiseFreq,pos[i*3+1]*noiseFreq,pos[i*3+2]*noiseFreq,t);
      pvx[i]+=cn.x*dt;pvy[i]+=cn.y*dt;pvz[i]+=cn.z*dt;
      pos[i*3]+=pvx[i]*dt*60;pos[i*3+1]+=pvy[i]*dt*60;pos[i*3+2]+=pvz[i]*dt*60;
    }
    pa.needsUpdate=la.needsUpdate=true;
    return alive;
  }

  function setTime(t){mat.uniforms.u_time.value=t;}
  function dispose(){pivot.remove(pts);geo.dispose();mat.dispose();}
  return{emit,burst,releaseAll,update,setTime,dispose};
}

/* ══ DIRECTION V2 ══════════════════════════════════════ */
function noteToPos3D(note,vel){
  const y=((note-NOTE_MIN)/(NOTE_MAX-NOTE_MIN))*7-3.5;
  const velN=(vel-1)/126;
  const z=(velN-.5)*4;
  const x=Math.sin(timeX*0.08)*3.5;
  return new THREE.Vector3(x,y,z);
}

function velToDir(vel,isEven){
  const VL=50,VH=110,VT=70,CO=35;
  let dx,dy;
  if(vel>=VH){dx=0;dy=1;}
  else if(vel<=VL){dx=0;dy=-1;}
  else if(vel>=VT){dx=isEven?.7:-.7;dy=.7;}
  else{dx=isEven?.7:-.7;dy=-.7;}
  const len=Math.sqrt(dx*dx+dy*dy);dx/=len;dy/=len;
  const velN=(vel-1)/126;
  const spd=(0.002+velN*velN*0.07)*spdMult;
  let omega=0;
  if(vel>CO&&vel>VL&&vel<VH){
    const k=(vel-CO)/(127-CO);
    const od=1.2+(1.0-1.2)*Math.max(0,Math.min(1,k));
    omega=od*(vel>=VT?1:-1)*Math.PI/180*0.5;
  }
  return{dvx:dx*spd,dvy:dy*spd,dvz:0.005*spd,omega,vx0:dx*spd,vy0:dy*spd};
}

/* ══ NOTES ACTIVES ═════════════════════════════════════ */
const activeNotes=new Map();
const dyingFlux=[]; // chaque élément : {flux, age, maxAge}

function applyAttraction(dt){
  const fl=[...activeNotes.values()];
  if(fl.length<2)return;
  for(let i=0;i<fl.length;i++){
    for(let j=i+1;j<fl.length;j++){
      const a=fl[i],b=fl[j];
      const dx=b.pos.x-a.pos.x,dy=b.pos.y-a.pos.y,dz=b.pos.z-a.pos.z;
      const dist=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001;
      const nx=dx/dist,ny=dy/dist,nz=dz/dist;
      let force=0;
      if(dist<1.2) force=-attractStr*4*(1.2-dist)/1.2;
      else if(dist<4) force=attractStr*(dist-1.2)/4;
      const f=force*dt*60;
      a.dvx+=nx*f;a.dvy+=ny*f;a.dvz+=nz*f;
      b.dvx-=nx*f;b.dvy-=ny*f;b.dvz-=nz*f;
    }
  }
}

function spawnNote(note,vel){
  if(activeNotes.has(note)) releaseNote(note);
  const pal=PALETTES[palIdx];
  const name=NOTE_NAMES[note%12];
  const hsl=pal[name]||[0,80,60];
  const rgb=hsl2rgb(hsl[0],hsl[1],Math.min(93,hsl[2]+Math.floor(note/12)*3));
  const velN=(vel-1)/126;
  const pos=noteToPos3D(note,vel);
  timeX+=0.7+(vel/127)*1.3;
  const flux=makeFlux(rgb[0],rgb[1],rgb[2]);
  const{dvx,dvy,dvz,omega,vx0,vy0}=velToDir(vel,note%2===0);
  activeNotes.set(note,{flux,pos,dvx,dvy,dvz,omega,angle:0,vx0,vy0,rgb,velN});
  addTrajPt(pos,rgb);
  if(!firstNote){firstNote=true;document.getElementById('hint').classList.add('gone');}
  logNote(note,vel,rgb);
}

function releaseNote(note){
  const b=activeNotes.get(note);
  if(!b)return;
  b.flux.releaseAll();
  dyingFlux.push({flux:b.flux, age:0, maxAge:fadeLife});
  activeNotes.delete(note);
}

function onPedalChange(down){
  const was=pedalDown;pedalDown=down;
  document.getElementById('ped-ind').classList.toggle('on',down);
  if(!down&&was){
    if(rotMode==='pedal') pivot.rotation.y+=Math.PI/4;
    [...activeNotes.keys()].forEach(n=>releaseNote(n));
  }
}

function clearAll(){
  for(const[,b] of activeNotes)b.flux.dispose();
  activeNotes.clear();
  for(const fl of dyingFlux)fl.flux.dispose();
  dyingFlux.length=0;
  trajPts.length=0;
  if(trajGeo)trajGeo.setDrawRange(0,0);
}

/* ══ BOUCLE ════════════════════════════════════════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta());
  const t=clock.getElapsedTime();

  if(rotMode==='auto') pivot.rotation.y+=rotSpd*0.00015*dt*60;

  applyAttraction(dt);

  for(const[note,b] of activeNotes){
    b.flux.setTime(t);
    // Courbure V2 : rotation de la direction de base
    b.angle+=b.omega;
    const cosA=Math.cos(b.angle),sinA=Math.sin(b.angle);
    const nx=b.vx0*cosA-b.vy0*sinA;
    const ny=b.vx0*sinA+b.vy0*cosA;
    b.dvx=nx; b.dvy=ny;
    // Curl noise : perturbation légère (ne remplace pas la direction)
    const cn=curlNoise(b.pos.x*noiseFreq,b.pos.y*noiseFreq,b.pos.z*noiseFreq,t);
    const spd=Math.sqrt(b.vx0*b.vx0+b.vy0*b.vy0);
    const noiseScale=Math.min(0.15, spd*1.5); // noise proportionnel à la vitesse, plafonné
    b.dvx+=cn.x*noiseScale; b.dvy+=cn.y*noiseScale; b.dvz+=cn.z*noiseScale;
    b.pos.x+=b.dvx*dt*60; b.pos.y+=b.dvy*dt*60; b.pos.z+=b.dvz*dt*60;
    // Rebonds avec burst
    let wnx=0,wny=0,wnz=0,bounced=false;
    if(b.pos.x>BOX.x){b.pos.x=BOX.x;b.vx0=-Math.abs(b.vx0);wnx=-1;bounced=true;}
    if(b.pos.x<-BOX.x){b.pos.x=-BOX.x;b.vx0=Math.abs(b.vx0);wnx=1;bounced=true;}
    if(b.pos.y>BOX.y){b.pos.y=BOX.y;b.vy0=-Math.abs(b.vy0);wny=-1;bounced=true;}
    if(b.pos.y<-BOX.y){b.pos.y=-BOX.y;b.vy0=Math.abs(b.vy0);wny=1;bounced=true;}
    if(b.pos.z>BOX.z){b.pos.z=BOX.z;b.dvz=-Math.abs(b.dvz);wnz=-1;bounced=true;}
    if(b.pos.z<-BOX.z){b.pos.z=-BOX.z;b.dvz=Math.abs(b.dvz);wnz=1;bounced=true;}
    if(bounced) b.flux.burst(wnx,wny,wnz);
    // Émettre
    for(let e=0;e<emitRate;e++){
      b.flux.emit(b.pos.x,b.pos.y,b.pos.z,b.dvx*0.08,b.dvy*0.08,b.dvz*0.08,true);
    }
    b.flux.update(dt,t);
  }

  for(let i=dyingFlux.length-1;i>=0;i--){
    const d=dyingFlux[i];
    d.age+=dt;
    d.flux.setTime(t);
    if(!d.flux.update(dt,t)){d.flux.dispose();dyingFlux.splice(i,1);}
  }

  // Fade trajectoires : disparaissent avec le dernier flux mourant
  if(trajLine){
    if(activeNotes.size>0){
      trajLine.material.opacity=0.6;
    } else if(dyingFlux.length>0){
      const oldest=dyingFlux.reduce((a,b)=>a.age>b.age?a:b);
      const ratio=Math.max(0,1-oldest.age/oldest.maxAge);
      trajLine.material.opacity=ratio*0.6;
    } else {
      trajLine.material.opacity=0;
    }
  }

  renderer.render(scene,camera);
}

/* ══ LOG ═══════════════════════════════════════════════ */
const logEl=document.getElementById('note-log');
function logNote(note,vel,rgb){
  const name=NOTE_NAMES[note%12],oct=Math.floor(note/12)-1;
  const d=document.createElement('div');d.className='nrow';
  d.innerHTML=`<div class="nbadge" style="background:rgb(${Math.round(rgb[0]*255)},${Math.round(rgb[1]*255)},${Math.round(rgb[2]*255)})"></div><span style="color:rgba(255,255,255,.72);min-width:26px">${name}${oct}</span><span style="color:rgba(255,255,255,.32)">vel ${vel}</span>`;
  logEl.prepend(d);if(logEl.children.length>6)logEl.removeChild(logEl.lastChild);
}

/* ══ MIDI ══════════════════════════════════════════════ */
const midiDot=document.getElementById('midi-dot');
const midiLbl=document.getElementById('midi-label');
function onMidi(e){
  const st=e.data[0]&0xF0,note=e.data[1],vel=e.data[2];
  if(st===0x90&&vel>0&&note>=NOTE_MIN&&note<=NOTE_MAX) spawnNote(note,vel);
  if((st===0x80||(st===0x90&&vel===0))&&note>=NOTE_MIN&&note<=NOTE_MAX) releaseNote(note);
  if(st===0xB0&&note===64) onPedalChange(vel>=64);
}
if(navigator.requestMIDIAccess){
  navigator.requestMIDIAccess({sysex:false}).then(midi=>{
    const conn=()=>{
      const inputs=[...midi.inputs.values()];
      if(inputs.length===0){
        midiDot.className='';midiDot.classList.add('err');
        midiLbl.textContent='Aucun appareil MIDI détecté';
      } else {
        inputs.forEach(i=>i.onmidimessage=onMidi);
        const names=inputs.map(i=>i.name).join(', ');
        midiDot.classList.add('on');
        midiLbl.textContent='MIDI — '+names;
      }
    };
    conn();midi.onstatechange=conn;
  }).catch(()=>{midiDot.classList.add('err');midiLbl.textContent='Accès MIDI refusé';});
}else{
  midiDot.classList.add('err');
  const isFirefox=navigator.userAgent.toLowerCase().includes('firefox');
  midiLbl.textContent=isFirefox?'WebMIDI non supporté → utilisez Chrome':'WebMIDI non supporté';
}

/* ══ CLAVIER ═══════════════════════════════════════════ */
const KEYMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,l:73};
const held=new Set();
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key===' '){e.preventDefault();onPedalChange(true);return;}
  if(e.key==='c'||e.key==='C'){clearAll();return;}
  const n=KEYMAP[e.key.toLowerCase()];
  if(n&&!held.has(e.key)){held.add(e.key);spawnNote(n,Math.floor(45+Math.random()*75));}
});
window.addEventListener('keyup',e=>{
  if(e.key===' '){onPedalChange(false);return;}
  const n=KEYMAP[e.key.toLowerCase()];
  if(n){held.delete(e.key);releaseNote(n);}
});

/* ══ CONTRÔLES ══════════════════════════════════════════ */
function bind(id,factor,setter,valId,suffix=''){
  document.getElementById(id).addEventListener('input',e=>{
    setter(+e.target.value/factor);
    document.getElementById(valId).textContent=e.target.value+suffix;
  });
}
function bindC(id,cb){document.getElementById(id).addEventListener('change',cb);}
bind('dens',1,v=>emitRate=v,'dens-v');
bind('life',1,v=>fadeLife=v,'life-v','s');
bind('spread',1000,v=>spreadAmt=v,'spread-v');
bind('burst',100,v=>burstStr=v,'burst-v');
bind('spd',100,v=>spdMult=v,'spd-v','%');
bind('namp',1000,v=>noiseAmp=v,'namp-v');
bind('nfreq',100,v=>noiseFreq=v,'nfreq-v');
bind('nspd',100,v=>noiseSpd=v,'nspd-v');
bind('attr',1000,v=>attractStr=v,'attr-v');
bind('rotspd',1,v=>rotSpd=v,'rotspd-v');
bindC('pal-sel',e=>palIdx=+e.target.value);
bindC('bg-sel',e=>{const c=e.target.value.split(',').map(Number);scene.background=new THREE.Color(c[0],c[1],c[2]);});
bindC('rot-sel',e=>rotMode=e.target.value);
bindC('grid-sel',e=>{showGrid=e.target.value==='1';gridGroup.visible=showGrid;});
bindC('traj-sel',e=>{showTraj=e.target.value==='1';if(trajLine)trajLine.visible=showTraj;});

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
